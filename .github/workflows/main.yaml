name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' 
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6.0.2
      with:
        submodules: recursive
    
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2.2.0
      with:
        cmake-version: '3.28'

    - name: Setup Cache for Vcpkg
      uses: actions/cache@v5.0.5
      with:
        path: |
          ${{ github.workspace }}/build/vcpkg_installed
          ${{ github.workspace }}/out/build/x64-release/vcpkg_installed
          C:/Users/runneradmin/AppData/Local/vcpkg/archives
          C:/vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Configure CMake
      shell: pwsh
      run: |
        # Point to the runner's built-in vcpkg clone explicitly
        $env:VCPKG_ROOT = "C:/vcpkg"
        cmake --preset x64-release

    - name: Compile Application
      run: cmake --build ./out/build/x64-release --config Release --parallel

    - name: Package Release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path ./publish
        Copy-Item "./out/build/x64-release/*.exe" -Destination "./publish/"
        Compress-Archive -Path ./publish/* -DestinationPath release-binary.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3.0.0
      with:
        files: release-binary.zip
        tag_name: ${{ github.ref_name }}
        name: "Release ${{ github.ref_name }}"
        draft: true 
        prerelease: true 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
