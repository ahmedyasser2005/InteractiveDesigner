name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' 
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2.0
      with:
        cmake-version: '3.28'

    - name: Configure CMake
      run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Compile Application
      run: cmake --build build --config Release --parallel

    - name: Package Release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path ./publish
        Copy-Item "./build/Release/*.exe" -Destination "./publish/"
        # Add DLLs or Assets here if needed
        Compress-Archive -Path ./publish/* -DestinationPath release-binary.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: release-binary.zip
        tag_name: ${{ github.ref_name }}
        name: "Release ${{ github.ref_name }}"
        draft: true 
        prerelease: true 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
