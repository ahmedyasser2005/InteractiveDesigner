name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2.0
      with:
        cmake-version: '3.28'

    - name: Configure CMake
      run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Compile Application
      run: cmake --build build --config Release --parallel

    # Only run these steps on 'main' push to create the release
    - name: Package Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        # Collect your .exe and any dependencies (DLLs, assets)
        New-Item -ItemType Directory -Path ./publish
        Copy-Item "./build/Release/*.exe" -Destination "./publish/"
        # Uncomment below if you have shaders or assets
        # Copy-Item "./assets" -Destination "./publish/assets" -Recurse
        Compress-Archive -Path ./publish/* -DestinationPath release-binary.zip

    - name: Create GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: release-binary.zip
        tag_name: v${{ github.run_number }}
        name: "Release v${{ github.run_number }}"
        body: "Automated build from commit ${{ github.sha }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
